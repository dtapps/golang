  # 每天 10:05（Asia/Shanghai）构建 viva 镜像：
  #   <registry>/<repo>/viva → golang + XCB/Vulkan + GTK3/WebKit2GTK 4.1
  #                           + 无头运行库 + viva CLI
  # 接在 nsgo（09:05）之后，与前面的多架构构建错开一小时，避免抢同一个 runner；
  # 此时距基础镜像产出（00:05）已过十小时，基座一定就绪，等待上限按常规 5 分钟。
  'crontab: 5 10 * * *':
