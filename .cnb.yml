include:
  - .cnb/workflows/build-golang.yml
  - .cnb/workflows/build-fnpack.yml
  - .cnb/workflows/build-wails3.yml
  - .cnb/workflows/build-wails2.yml
  - .cnb/workflows/build-fyne.yml
  - .cnb/workflows/build-mygo.yml
  - .cnb/workflows/cnb-sechook.yml
  - .cnb/workflows/code-review.yml
  - .cnb/workflows/code-security-config.yml
  - .cnb/workflows/codewiki.yml
  - .cnb/workflows/knowledge-base.yml
  - .cnb/workflows/sca.yml

main:
  # 每天 00:05（Asia/Shanghai）构建 golang 基础镜像：
  #   <registry>/<repo> → golang（不含 fnpack）
  # 基座用 Dockerfile 默认的 golang:1-trixie（自动跟随最新稳定 Go），构建脚本把实际
  # Go 版本解析出来（如 1.27.3），直接推 <实际版本> 标签，冒烟通过后才把 latest /
  # minor 提升到该 digest；同名标签每天被覆盖，回查某天的产物要靠 annotation 里的 digest。
  'crontab: 5 0 * * *':
    - name: build-golang
      runner:
        tags: cnb:arch:amd64 # 指定 Runner 必须有这个标签
      # CNB 的 docker 服务默认已支持多架构 buildx，无需 options.rootlessBuildkitd
      services:
        - docker # 启用 Docker 服务（用于 docker buildx/push）
      # 远程 import 是可变引用：main 一改 CI 行为就变，PR 里看不到，也无法审计。
      # TODO 收敛：把 docker.yml vendor 进 .cnb/envs/ 纳入评审，或至少钉到具体
      # commit（https://cnb.cool/dtapp/envs/-/blob/<40 位 sha>/docker.yml）。
      imports:
        - https://cnb.cool/dtapp/envs/-/blob/main/docker.yml # 引入环境变量/配置
        # 不要把 .cnb/scripts/build-golang.sh 放进 imports（${...} 会被改写）
      stages:
        - name: 构建并推送多架构镜像
          script: |
            source .cnb/scripts/build-golang.sh
        # 把本次产物的 digest / 体积 / 构建时间写成 commit 元数据。
        # README 徽章从 /-/badge/annotation/commit/latest/{key} 读取这几个值。
        - name: 写入镜像元数据
          # cnbcool/annotations 目前只发 :latest，没有可固定的版本 tag，构建网络内也
          # 取不到 digest（hub.docker.com 不可达）。TODO 待其发布版本化 tag 后改成
          # @sha256:<digest>，避免插件升级悄悄改变元数据写入行为。
          image: cnbcool/annotations:latest
          settings:
            type: ADD
            fromJsonFile: .cnb/annotation.json

  # 每天 03:05（Asia/Shanghai）构建 fnpack 镜像：
  #   <registry>/<repo>/fnpack → golang + fnpack
  # 与上一条流水线错开三小时，确保基础镜像 <go 版本> 标签已经推好；
  # 脚本 FROM 那个标签，只追加 fnpack 二进制，不重复安装工具链。
  'crontab: 5 3 * * *':
    - name: build-fnpack
      runner:
        tags: cnb:arch:amd64
      services:
        - docker
      imports:
        - https://cnb.cool/dtapp/envs/-/blob/main/docker.yml
        # 不要把 .cnb/scripts/build-fnpack.sh 放进 imports（${...} 会被改写）
      stages:
        - name: 构建并推送多架构镜像
          script: |
            source .cnb/scripts/build-fnpack.sh
        - name: 写入镜像元数据
          image: cnbcool/annotations:latest
          settings:
            type: ADD
            fromJsonFile: .cnb/annotation-fnpack.json

  # 每天 06:05（Asia/Shanghai）构建 wails3 镜像：
  #   <registry>/<repo>/wails3 → golang + GTK4/WebKitGTK + wails3 CLI
  # 与上一条流水线再错开三小时，确保基础镜像 <go 版本> 标签已经推好；
  # 脚本 FROM 那个标签，只追加 GTK4/WebKitGTK 与 wails3 CLI，不重复安装工具链。
  'crontab: 5 6 * * *':
    - name: build-wails3
      runner:
        tags: cnb:arch:amd64
      services:
        - docker
      imports:
        - https://cnb.cool/dtapp/envs/-/blob/main/docker.yml
        # 不要把 .cnb/scripts/build-wails3.sh 放进 imports（${...} 会被改写）
      stages:
        - name: 构建并推送多架构镜像
          script: |
            source .cnb/scripts/build-wails3.sh
        - name: 写入镜像元数据
          image: cnbcool/annotations:latest
          settings:
            type: ADD
            fromJsonFile: .cnb/annotation-wails3.json

  # 每天 09:05（Asia/Shanghai）构建 wails2 镜像：
  #   <registry>/<repo>/wails2 → golang + GTK3/WebKit2GTK + wails CLI
  # 与前面的多架构构建错开三小时，避免抢同一个 runner。
  'crontab: 5 9 * * *':
    - name: build-wails2
      runner:
        tags: cnb:arch:amd64
      services:
        - docker
      imports:
        - https://cnb.cool/dtapp/envs/-/blob/main/docker.yml
        # 不要把 .cnb/scripts/build-wails2.sh 放进 imports（${...} 会被改写）
      stages:
        - name: 构建并推送多架构镜像
          script: |
            source .cnb/scripts/build-wails2.sh
        - name: 写入镜像元数据
          image: cnbcool/annotations:latest
          settings:
            type: ADD
            fromJsonFile: .cnb/annotation-wails2.json

  # 每天 12:05（Asia/Shanghai）构建 fyne 镜像：
  #   <registry>/<repo>/fyne → golang + OpenGL/X11/Wayland + fyne CLI
  # 接在 wails2（09:05）之后，与前面的多架构构建错开三小时，避免抢同一个 runner。
  'crontab: 5 12 * * *':
    - name: build-fyne
      runner:
        tags: cnb:arch:amd64
      services:
        - docker
      imports:
        - https://cnb.cool/dtapp/envs/-/blob/main/docker.yml
        # 不要把 .cnb/scripts/build-fyne.sh 放进 imports（${...} 会被改写）
      stages:
        - name: 构建并推送多架构镜像
          script: |
            source .cnb/scripts/build-fyne.sh
        - name: 写入镜像元数据
          image: cnbcool/annotations:latest
          settings:
            type: ADD
            fromJsonFile: .cnb/annotation-fyne.json

  # 每天 15:05（Asia/Shanghai）构建 mygo 镜像：
  #   <registry>/<repo>/mygo → golang + GTK3/WebKitGTK4.1 + 无头运行库 + mygo CLI + bun
  # 接在 fyne（12:05）之后，与前面的多架构构建错开三小时，避免抢同一个 runner。
  'crontab: 5 15 * * *':
    - name: build-mygo
      runner:
        tags: cnb:arch:amd64
      services:
        - docker
      imports:
        - https://cnb.cool/dtapp/envs/-/blob/main/docker.yml
        # 不要把 .cnb/scripts/build-mygo.sh 放进 imports（${...} 会被改写）
      stages:
        - name: 构建并推送多架构镜像
          script: |
            source .cnb/scripts/build-mygo.sh
        - name: 写入镜像元数据
          image: cnbcool/annotations:latest
          settings:
            type: ADD
            fromJsonFile: .cnb/annotation-mygo.json
