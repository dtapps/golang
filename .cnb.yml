        - name: 写入镜像元数据
          image: cnbcool/annotations:latest
          settings:
            type: ADD
            fromJsonFile: .cnb/annotation-gio.json

  # 每天 09:05（Asia/Shanghai）构建 nsgo 镜像：
  #   <registry>/<repo>/nsgo → golang + GTK4/WebKitGTK 6.0/Pango/Cairo/GStreamer
  #                           + 无头运行库 + nsgo CLI
  # 接在 gio（08:05）之后，与前面的多架构构建错开一小时，避免抢同一个 runner；
  # 此时距基础镜像产出（00:05）已过九小时，基座一定就绪。
  'crontab: 5 9 * * *':
    - name: build-nsgo
      runner:
