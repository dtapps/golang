branch:
  - buttons:
      - name: 打包 Golang 镜像（多架构 amd64 + arm64）
        description: 构建并推送 golang 基础镜像（amd64 + arm64 多架构），产出版本、latest 与单平台标签；不含 fnpack / wails3 / wails2 / fyne / mygo / gio
          / nsgo / viva / asuka
        event: web_trigger_build_golang # 触发的 CI 事件名
        permissions:
          roles:
            - owner
            - master
            - developer
        inputs:
          version:
            name: Go 版本
            description: 选填。Go 版本：留空 = 跟随 Dockerfile 的 GO_VERSION（golang:1-trixie，自动跟随最新稳定 Go）；也可填 1.27 或 1.27.3
            required: false
            type: input
            default: ''
      - name: 打包 Golang + fnpack 镜像（多架构 amd64 + arm64）
        description: 基于已推送的 golang 基础镜像，构建并推送 golang/fnpack（amd64 + arm64 多架构，只多一个 fnpack 二进制）
        event: web_trigger_build_fnpack # 触发的 CI 事件名
        permissions:
          roles:
            - owner
            - master
            - developer
        inputs:
          version:
            name: Go 版本
            description: 选填。对应基础镜像的 Go 版本：留空 = 跟随 Dockerfile 的 GO_VERSION（最新稳定 Go）；也可填 1.27 或 1.27.3
            required: false
            type: input
            default: ''
          fnpack_version:
            name: fnpack 版本
            description: 选填。fnpack 版本：留空 = 使用 Dockerfile 的 FNPACK_VERSION（当前 1.2.3，暂作为最新版本）；也可填 1.2.3
            required: false
            type: input
            default: ''
      - name: 打包 Golang + wails3 镜像（多架构 amd64 + arm64）
        description: 基于已推送的 golang 基础镜像，构建并推送 golang/wails3（amd64 + arm64 多架构，含 GTK4 / WebKitGTK 与 wails3 CLI）
        event: web_trigger_build_wails3 # 触发的 CI 事件名
        permissions:
          roles:
            - owner
            - master
            - developer
        inputs:
          version:
            name: Go 版本
            description: 选填。对应基础镜像的 Go 版本：留空 = 跟随 Dockerfile 的 GO_VERSION（最新稳定 Go）；也可填 1.27 或 1.27.3
            required: false
            type: input
            default: ''
          wails3_version:
            name: wails3 版本
            description: 选填。wails3 版本：留空 = 解析上游最新稳定 tag（如 v3.1.0）；也可填 v3.0.0 / 3.1.0 / v3.0.0-beta.34
            required: false
            type: input
            default: ''
      - name: 打包 Golang + wails2 镜像（多架构 amd64 + arm64）
        description: 基于已推送的 golang 基础镜像，构建并推送 golang/wails2（amd64 + arm64 多架构，含 GTK3 / WebKit2GTK 4.1 与 wails CLI）
        event: web_trigger_build_wails2 # 触发的 CI 事件名
        permissions:
          roles:
            - owner
            - master
            - developer
        inputs:
          version:
            name: Go 版本
            description: 选填。对应基础镜像的 Go 版本：留空 = 跟随 Dockerfile 的 GO_VERSION（最新稳定 Go）；也可填 1.27 或 1.27.3
            required: false
            type: input
            default: ''
          wails2_version:
            name: wails2 版本
            description: 选填。wails2 版本：留空 = 解析上游最新稳定 tag（如 v2.17.1）；也可填 v2.17.1 / 2.17.1
            required: false
            type: input
            default: ''
      - name: 打包 Golang + fyne 镜像（多架构 amd64 + arm64）
        description: 基于已推送的 golang 基础镜像，构建并推送 golang/fyne（amd64 + arm64 多架构，含 OpenGL / X11 / Wayland 开发包与 fyne CLI）
        event: web_trigger_build_fyne # 触发的 CI 事件名
        permissions:
          roles:
            - owner
            - master
            - developer
        inputs:
          version:
            name: Go 版本
            description: 选填。对应基础镜像的 Go 版本：留空 = 跟随 Dockerfile 的 GO_VERSION（最新稳定 Go）；也可填 1.27 或 1.27.3
            required: false
            type: input
            default: ''
          fyne_version:
            name: fyne CLI 版本
            description: 选填。fyne CLI 版本：留空 = 解析上游最新稳定 tag（如 v1.7.4）；也可填 v1.7.4 / 1.7.4
            required: false
            type: input
            default: ''
      - name: 打包 Golang + mygo 镜像（多架构 amd64 + arm64）
        description: 基于已推送的 golang 基础镜像，构建并推送 golang/mygo（amd64 + arm64 多架构，含 GTK3 / WebKitGTK 4.1 开发包、无头运行库、mygo CLI 与 bun）
        event: web_trigger_build_mygo # 触发的 CI 事件名
        permissions:
          roles:
            - owner
            - master
            - developer
        inputs:
          version:
            name: Go 版本
            description: 选填。对应基础镜像的 Go 版本：留空 = 跟随 Dockerfile 的 GO_VERSION（最新稳定 Go）；也可填 1.27 或 1.27.3
            required: false
            type: input
            default: ''
          mygo_version:
            name: mygo CLI 版本
            description: 选填。mygo CLI 版本：留空 = 解析上游最新稳定 tag（如 v0.8.1）；也可填 v0.8.1 / 0.8.1
            required: false
            type: input
            default: ''
          bun_version:
            name: bun 版本
            description: 选填。bun 版本（前端模板用）：留空 = 解析 npm 上的最新稳定版（如 1.4.4）；也可填 1.4.4
            required: false
            type: input
            default: ''
      - name: 打包 Golang + gio 镜像（多架构 amd64 + arm64）
        description: 基于已推送的 golang 基础镜像，构建并推送 golang/gio（amd64 + arm64 多架构，含 EGL/GLES、X11、Wayland、Vulkan 开发包、无头运行库与 gogio
          CLI）
        event: web_trigger_build_gio # 触发的 CI 事件名
        permissions:
          roles:
            - owner
            - master
            - developer
        inputs:
          version:
            name: Go 版本
            description: 选填。对应基础镜像的 Go 版本：留空 = 跟随 Dockerfile 的 GO_VERSION（最新稳定 Go）；也可填 1.27 或 1.27.3
            required: false
            type: input
            default: ''
          gio_version:
            name: gogio CLI 版本
            description: 选填。gogio CLI 版本（模块 gioui.org/cmd，注意不是 gio）：留空 = 解析上游最新稳定 tag（如 v0.10.3）；也可填 v0.10.3 / 0.10.3
            required: false
            type: input
            default: ''
      - name: 打包 Golang + nsgo 镜像（多架构 amd64 + arm64）
        description: 基于已推送的 golang 基础镜像，构建并推送 golang/nsgo（amd64 + arm64 多架构，含 GTK4 / WebKitGTK 6.0 / GStreamer 开发包、无头运行库与
          nsgo CLI）
        event: web_trigger_build_nsgo # 触发的 CI 事件名
        permissions:
          roles:
            - owner
            - master
            - developer
        inputs:
          version:
            name: Go 版本
            description: 选填。对应基础镜像的 Go 版本：留空 = 跟随 Dockerfile 的 GO_VERSION（最新稳定 Go）；也可填 1.27 或 1.27.3
            required: false
            type: input
            default: ''
          nsgo_version:
            name: nsgo CLI 版本
            description: 选填。nsgo CLI 版本（模块 github.com/nsgo-dev/nsgo）：上游暂无 tag，留空 = 把 @latest 解析成具体伪版本； 也可填 v0.0.0-20260101000000-abcdef123456
              伪版本或 vX.Y.Z
            required: false
            type: input
            default: ''
      - name: 打包 Golang + viva 镜像（多架构 amd64 + arm64）
        description: 基于已推送的 golang 基础镜像，构建并推送 golang/viva（amd64 + arm64 多架构，含 XCB / Vulkan、GTK3 / WebKit2GTK 4.1 开发包、无头运行库与
          viva CLI）
        event: web_trigger_build_viva # 触发的 CI 事件名
        permissions:
          roles:
            - owner
            - master
            - developer
        inputs:
          version:
            name: Go 版本
            description: 选填。对应基础镜像的 Go 版本：留空 = 跟随 Dockerfile 的 GO_VERSION（最新稳定 Go）；也可填 1.27 或 1.27.3
            required: false
            type: input
            default: ''
          viva_version:
            name: viva CLI 版本
            description: 选填。viva CLI 版本（模块 github.com/vivaui/viva）：留空 = 解析上游最新稳定 tag（如 v0.6.4）；也可填 v0.6.4 / 0.6.4
            required: false
            type: input
            default: ''
      - name: 打包 Golang + asuka 镜像（多架构 amd64 + arm64）
        description: 基于已推送的 golang 基础镜像，构建并推送 golang/asuka（amd64 + arm64 多架构，含 GTK4 / libadwaita 开发包、无头运行库与 asuka CLI）
        event: web_trigger_build_asuka # 触发的 CI 事件名
        permissions:
          roles:
            - owner
            - master
            - developer
        inputs:
          version:
            name: Go 版本
            description: 选填。对应基础镜像的 Go 版本：留空 = 跟随 Dockerfile 的 GO_VERSION（最新稳定 Go）；也可填 1.27 或 1.27.3
            required: false
            type: input
            default: ''
          asuka_version:
            name: asuka CLI 版本
            description: 选填。asuka CLI 版本（模块 github.com/egoist/asuka）：留空 = 解析上游最新稳定 tag（如 v0.1.1）；也可填 v0.1.1 / 0.1.1
            required: false
            type: input
            default: ''
      - name: 生成 Code Wiki
        description: 重新分析仓库并生成 Code Wiki 文档
        event: web_trigger_codewiki # 触发的 CI 事件名
        permissions:
          roles:
            - owner
            - master
            - developer
