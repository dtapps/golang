branch:
  - buttons:
      - name: 打包 Golang 镜像（多架构 amd64 + arm64）
        description: 构建并推送 golang 基础镜像（amd64 + arm64 多架构），产出版本、latest 与单平台标签；不含 fnpack / wails3
        event: web_trigger_build_golang # 触发的 CI 事件名
        permissions:
          roles:
            - owner
            - master
            - developer
        inputs:
          version:
            description: 选填。Go 版本：留空 = 跟随 Dockerfile 的 GO_VERSION（golang:1-trixie，自动跟随最新稳定 Go）；也可填 1.27 或 1.27.3
            required: false
            type: input
            default: ''
      - name: 打包 Golang + fnpack 镜像（多架构 amd64 + arm64）
        description: 基于已推送的 golang 基础镜像，构建并推送 golang/fnpack（amd64 + arm64 多架构，只多一个 fnpack 二进制）
        event: web_trigger_build_fnpack # 触发的 CI 事件名
        permissions:
          roles:
            - owner
            - master
            - developer
        inputs:
          version:
            description: 选填。对应基础镜像的 Go 版本：留空 = 跟随 Dockerfile 的 GO_VERSION（最新稳定 Go）；也可填 1.27 或 1.27.3
            required: false
            type: input
            default: ''
          fnpack_version:
            description: 选填。fnpack 版本：留空 = 使用 Dockerfile 的 FNPACK_VERSION（当前 1.2.3，暂作为最新版本）；也可填 1.2.3
            required: false
            type: input
            default: ''
      - name: 打包 Golang + wails3 镜像（多架构 amd64 + arm64）
        description: 基于已推送的 golang 基础镜像，构建并推送 golang/wails3（amd64 + arm64 多架构，含 GTK4 / WebKitGTK 与 wails3 CLI）
        event: web_trigger_build_wails3 # 触发的 CI 事件名
        permissions:
          roles:
            - owner
            - master
            - developer
        inputs:
          version:
            description: 选填。对应基础镜像的 Go 版本：留空 = 跟随 Dockerfile 的 GO_VERSION（最新稳定 Go）；也可填 1.27 或 1.27.3
            required: false
            type: input
            default: ''
          wails3_version:
            description: 选填。wails3 版本：留空 = 解析上游最新稳定 tag（如 v3.1.0）；也可填 v3.0.0 / 3.1.0 / v3.0.0-beta.34
            required: false
            type: input
            default: ''
      - name: 生成 Code Wiki
        description: 重新分析仓库并生成 Code Wiki 文档（本仓库不发版，故提供手动入口）
        event: web_trigger_codewiki # 触发的 CI 事件名
        permissions:
          roles:
            - owner
            - master
            - developer
