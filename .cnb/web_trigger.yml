branch:
  - buttons:
      - name: 打包 Golang 镜像（多架构 amd64 + arm64）
        description: 构建并推送 golang 基础镜像（不含 fnpack）到制品库，含多架构 manifest list 与单平台标签
        event: web_trigger_build_golang # 触发的 CI 事件名
        permissions:
          roles:
            - owner
            - master
            - developer
        inputs:
          version:
            description: 选填。Go 版本：留空 = 跟随 Dockerfile 的 GO_VERSION（golang:1.27.3-trixie）；也可填 1.27 或 1.27.3
            required: false
            type: input
            default: ''
      - name: 打包 Golang + fnpack 镜像（多架构 amd64 + arm64）
        description: 基于已推送的 golang 基础镜像，构建并推送 golang/fnpack（只多一个 fnpack 二进制）
        event: web_trigger_build_fnpack # 触发的 CI 事件名
        permissions:
          roles:
            - owner
            - master
            - developer
        inputs:
          version:
            description: 选填。对应基础镜像的 Go 版本：留空 = 跟随 Dockerfile 的 GO_VERSION；也可填 1.27 或 1.27.3
            required: false
            type: input
            default: ''
      - name: 生成 Code Wiki
        description: 重新分析仓库并生成 Code Wiki 文档（本仓库不发版，故提供手动入口）
        event: web_trigger_codewiki # 触发的 CI 事件名
        permissions:
          roles:
            - owner
            - master
            - developer
