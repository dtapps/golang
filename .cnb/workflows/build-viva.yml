.build_viva: &build_viva
  name: build-viva
  runner:
    tags: cnb:arch:amd64 # 指定 Runner 必须有这个标签
  # CNB 的 docker 服务默认已支持多架构 buildx，无需 options.rootlessBuildkitd
  services:
    - docker # 启用 Docker 服务（用于 docker buildx/push）
  # 远程 import 是可变引用：main 一改 CI 行为就变，PR 里看不到，也无法审计。
  # TODO 收敛：把 docker.yml vendor 进 .cnb/envs/ 纳入评审，或至少钉到具体
  # commit（https://cnb.cool/dtapp/envs/-/blob/<40 位 sha>/docker.yml）。
  imports:
    - https://cnb.cool/dtapp/envs/-/blob/main/docker.yml # 引入环境变量/配置
    # 不要把 .cnb/scripts/build-viva.sh 放进 imports：imports 会对被引入的
    # 文件做变量处理，脚本里的 ${...} 会被改写成带引号的字面量。脚本在仓库里，
    # 由下面的 `source` 直接执行即可。
  stages:
    - name: 构建并推送多架构镜像
      script: |
        source .cnb/scripts/build-viva.sh
    # 把本次产物的 digest / 体积 / 构建时间写成 commit 元数据。
    - name: 写入镜像元数据
      image: cnbcool/annotations:latest
      settings:
        type: ADD
        fromJsonFile: .cnb/annotation-viva.json

'**':
  # 自定义按钮可触发的事件：web_trigger_build_viva
  # 用 docker buildx 一次构建 amd64 + arm64，推送 <registry>/<repo>/viva。
  # 基础镜像 <registry>/<repo>:<go 版本> 由 build-golang.yml 产出，这里只追加
  # XCB、Vulkan、Pango / Cairo 与 GTK3 / WebKit2GTK 4.1 运行与开发包、无头运行库
  # 与 viva CLI。
  #
  # 定时任务按「每 1 小时一个」排在 nsgo（09:05）之后，落在 10:05——距基座
  # build-golang（00:05）已过十小时，脚本按常规等 5 分钟即可。
  #
  # viva 用 purego 在运行期 dlopen 系统库，Linux 默认后端是 XCB + Vulkan，纯 Go
  # 就能编译、不需要 cgo；带 vivagtk build tag 时改走 GTK3 壳层，内嵌 WebView 用
  # WebKit2GTK 4.1。镜像的重点是把这套运行库装齐（Dockerfile 第 1 层用 pkg-config
  # + ldconfig 逐个断言，缺一个就构建失败）。
  #
  # viva 版本默认跟随上游最新稳定版（Dockerfile 的 VIVA_VERSION=latest，脚本构建前
  # 解析成具体 tag 再传进 build-arg，层缓存才跟得上版本）。手动触发可以填
  # viva_version 钉住。
  web_trigger_build_viva:
    - *build_viva

main:
  # 每天 10:05（Asia/Shanghai）构建 viva，与手动按钮共用上面的 job 定义。
  'crontab: 5 10 * * *':
    - *build_viva
