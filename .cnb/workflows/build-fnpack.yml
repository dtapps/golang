'**':
  # 自定义按钮可触发的事件：web_trigger_build_fnpack
  # 用 docker buildx 一次构建 amd64 + arm64，推送 <registry>/<repo>/fnpack。
  # 基础镜像 <registry>/<repo>:<go 版本> 由 build-golang.yml 产出，这里只追加
  # fnpack 二进制；定时任务给基础镜像留了一小时（00:05 → 01:05）。
  #
  # fnpack 从 https://static2.fnnas.com 下载，不经过 GitHub Release，
  # 因此这里不需要 DaoCloud 镜像参数。
  web_trigger_build_fnpack:
    - name: build-fnpack
      runner:
        tags: cnb:arch:amd64 # 指定 Runner 必须有这个标签
      # CNB 的 docker 服务默认已支持多架构 buildx，无需 options.rootlessBuildkitd
      services:
        - docker # 启用 Docker 服务（用于 docker buildx/push）
      # 远程 import 是可变引用：main 一改 CI 行为就变，PR 里看不到，也无法审计。
      # TODO 收敛：把 docker.yml vendor 进 .cnb/envs/ 纳入评审，或至少钉到具体
      # commit（https://cnb.cool/dtapp/envs/-/blob/<40 位 sha>/docker.yml）。
      imports:
        - https://cnb.cool/dtapp/envs/-/blob/main/docker.yml # 引入环境变量/配置
        # 不要把 .cnb/scripts/build-fnpack.sh 放进 imports：imports 会对被引入的
        # 文件做变量处理，脚本里的 ${...} 会被改写成带引号的字面量。脚本在仓库里，
        # 由下面的 `source` 直接执行即可。
      stages:
        - name: 构建并推送多架构镜像
          script: |
            source .cnb/scripts/build-fnpack.sh
        # 把本次产物的 digest / 体积 / 构建时间写成 commit 元数据。
        - name: 写入镜像元数据
          image: cnbcool/annotations:latest
          settings:
            type: ADD
            fromJsonFile: .cnb/annotation-fnpack.json

  # PR 校验：不推送，先构建基础镜像再构建 fnpack，证明继承链可用。
  # 只对真正改到 fnpack 构建输入的 PR 生效。
  pull_request:
    - name: validate-fnpack
      runner:
        tags: cnb:arch:amd64
      services:
        - docker
      stages:
        - name: 构建（不推送）与冒烟
          script: |
            set -eu
            changed=""
            if [ -n "${CNB_TARGET_BRANCH:-}" ] \
              && git rev-parse --verify "origin/${CNB_TARGET_BRANCH}" >/dev/null 2>&1; then
              changed="$(git diff --name-only "origin/${CNB_TARGET_BRANCH}...HEAD" 2>/dev/null || true)"
            elif git rev-parse --verify HEAD~1 >/dev/null 2>&1; then
              changed="$(git diff --name-only HEAD~1 2>/dev/null || true)"
            fi
            case "${changed}" in
              *.cnb/docker/Dockerfile.fnpack* | *.cnb/scripts/build-fnpack.sh* | *.cnb/workflows/build-fnpack.yml*)
                echo "变更涉及 fnpack 构建输入，开始校验"
                ;;
              "")
                echo "无法确定变更范围，默认执行校验"
                ;;
              *)
                echo "变更不涉及 fnpack 构建输入，跳过校验："
                printf '%s\n' "${changed}"
                exit 0
                ;;
            esac
            # CNB 在国内，PR 校验也走 DaoCloud 镜像。
            # 用 docker build 而不是 buildx：fnpack 镜像 FROM 本地刚构建的 golang:pr，
            # docker-container builder 看不到宿主 Docker 镜像库，会去 registry 拉取而失败。
            DOCKER_BUILDKIT=1 docker build --platform linux/amd64 --pull \
              --build-arg GITHUB_MIRROR=https://files.m.daocloud.io \
              --build-arg NODE_MIRROR=https://files.m.daocloud.io \
              -f .cnb/docker/Dockerfile.golang -t golang:pr . || exit 1
            DOCKER_BUILDKIT=1 docker build --platform linux/amd64 \
              --build-arg GOLANG_IMAGE=golang:pr \
              -f .cnb/docker/Dockerfile.fnpack -t golang-fnpack:pr . || exit 1
            # fnpack 镜像：工具链继承 + fnpack 存在
            docker run --rm golang-fnpack:pr sh -eu -c '
              go version | grep -q "^go version go[0-9]"
              command -v fnpack >/dev/null 2>&1
              test -x /usr/local/bin/fnpack
              for b in go node pnpm sqlc golangci-lint; do
                command -v "$b" >/dev/null 2>&1
              done
              printf "SMOKE_OK"
            ' | grep -q 'SMOKE_OK' || exit 1
