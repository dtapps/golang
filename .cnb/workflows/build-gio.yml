'**':
  # 自定义按钮可触发的事件：web_trigger_build_gio
  # 用 docker buildx 一次构建 amd64 + arm64，推送 <registry>/<repo>/gio。
  # 基础镜像 <registry>/<repo>:<go 版本> 由 build-golang.yml 产出，这里只追加
  # EGL/GLES、X11、Wayland、Vulkan 开发包、无头运行库与 gogio CLI；定时任务给
  # 基础镜像留了十八小时（00:05 → 18:05）。
  #
  # 变体名叫 gio，CLI 却叫 gogio（模块 gioui.org/cmd），两者不要混。gogio 是
  # 「打包」工具，没有 linux 目标也没有 version 子命令；Linux 桌面程序就是普通
  # go build + cgo，所以本镜像的重点是把 EGL/GLES、X11、Wayland、Vulkan 开发包
  # 装齐（Dockerfile 第 1 层用 pkg-config 逐个断言 .pc 存在，缺一个就构建失败）。
  #
  # gogio 版本默认跟随上游最新稳定版（Dockerfile 的 GIO_VERSION=latest，脚本构建
  # 前解析成具体 tag 再传进 build-arg，层缓存才跟得上版本）。手动触发可以填
  # gio_version 钉住。
  web_trigger_build_gio:
    - name: build-gio
      runner:
        tags: cnb:arch:amd64 # 指定 Runner 必须有这个标签
      # CNB 的 docker 服务默认已支持多架构 buildx，无需 options.rootlessBuildkitd
      services:
        - docker # 启用 Docker 服务（用于 docker buildx/push）
      # 远程 import 是可变引用：main 一改 CI 行为就变，PR 里看不到，也无法审计。
      # TODO 收敛：把 docker.yml vendor 进 .cnb/envs/ 纳入评审，或至少钉到具体
      # commit（https://cnb.cool/dtapp/envs/-/blob/<40 位 sha>/docker.yml）。
      imports:
        - https://cnb.cool/dtapp/envs/-/blob/main/docker.yml # 引入环境变量/配置
        # 不要把 .cnb/scripts/build-gio.sh 放进 imports：imports 会对被引入的
        # 文件做变量处理，脚本里的 ${...} 会被改写成带引号的字面量。脚本在仓库里，
        # 由下面的 `source` 直接执行即可。
      stages:
        - name: 构建并推送多架构镜像
          script: |
            source .cnb/scripts/build-gio.sh
        # 把本次产物的 digest / 体积 / 构建时间写成 commit 元数据。
        - name: 写入镜像元数据
          image: cnbcool/annotations:latest
          settings:
            type: ADD
            fromJsonFile: .cnb/annotation-gio.json
