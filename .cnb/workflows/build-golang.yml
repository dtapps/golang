'**':
  # 自定义按钮可触发的事件：web_trigger_build_golang
  # 用 docker buildx 一次构建 amd64 + arm64，推送 <registry>/<repo>（golang）。
  # fnpack 镜像是另一个地址，由 build-fnpack.yml 单独构建：它 FROM 这里推好的
  # <go 版本> 标签。两条流水线各自对应一个镜像地址。
  #
  # 基座默认 golang:1.27.3-trixie，脚本解析出实际 Go 版本后直接用它当标签
  # （同名标签每天覆盖），latest / minor 在冒烟通过后按 digest 提升。
  #
  # CNB 在国内：GitHub Release 与 nodejs.org 下载走 https://files.m.daocloud.io，
  # 由构建脚本以 --build-arg GITHUB_MIRROR / NODE_MIRROR 传入。
  web_trigger_build_golang:
    - name: build-golang
      runner:
        tags: cnb:arch:amd64 # 指定 Runner 必须有这个标签
      # CNB 的 docker 服务默认已支持多架构 buildx，无需 options.rootlessBuildkitd
      services:
        - docker # 启用 Docker 服务（用于 docker buildx/push）
      # 远程 import 是可变引用：main 一改 CI 行为就变，PR 里看不到，也无法审计。
      # TODO 收敛：把 docker.yml vendor 进 .cnb/envs/ 纳入评审，或至少钉到具体
      # commit（https://cnb.cool/dtapp/envs/-/blob/<40 位 sha>/docker.yml）。
      imports:
        - https://cnb.cool/dtapp/envs/-/blob/main/docker.yml # 引入环境变量/配置
        # 不要把 .cnb/scripts/build-golang.sh 放进 imports：imports 会对被引入的
        # 文件做变量处理，脚本里的 ${...} 会被改写成带引号的字面量。脚本在仓库里，
        # 由下面的 `source` 直接执行即可。
      stages:
        - name: 构建并推送多架构镜像
          script: |
            source .cnb/scripts/build-golang.sh
        # 把本次产物的 digest / 体积 / 构建时间写成 commit 元数据。
        # README 徽章从 /-/badge/annotation/commit/latest/{key} 读取这几个值。
        - name: 写入镜像元数据
          # cnbcool/annotations 目前只发 :latest，没有可固定的版本 tag，构建网络内也
          # 取不到 digest（hub.docker.com 不可达）。TODO 待其发布版本化 tag 后改成
          # @sha256:<digest>，避免插件升级悄悄改变元数据写入行为。
          image: cnbcool/annotations:latest
          settings:
            type: ADD
            fromJsonFile: .cnb/annotation.json

  # PR 校验：不推送，只证明 Dockerfile 能构建、容器能起来。
  # 只对真正改到构建输入的 PR 生效，纯文档 PR 直接跳过。
  pull_request:
    - name: validate-golang
      runner:
        tags: cnb:arch:amd64
      services:
        - docker
      stages:
        - name: 构建（不推送）与冒烟
          script: |
            set -eu
            # 判断本次 PR 是否触及构建输入；判断不出来时按「要校验」处理
            changed=""
            if [ -n "${CNB_TARGET_BRANCH:-}" ] \
              && git rev-parse --verify "origin/${CNB_TARGET_BRANCH}" >/dev/null 2>&1; then
              changed="$(git diff --name-only "origin/${CNB_TARGET_BRANCH}...HEAD" 2>/dev/null || true)"
            elif git rev-parse --verify HEAD~1 >/dev/null 2>&1; then
              changed="$(git diff --name-only HEAD~1 2>/dev/null || true)"
            fi
            case "${changed}" in
              *.cnb/docker/Dockerfile.golang* | *.cnb/scripts/build-golang.sh* | *.cnb/workflows/build-golang.yml*)
                echo "变更涉及构建输入，开始校验"
                ;;
              "")
                echo "无法确定变更范围，默认执行校验"
                ;;
              *)
                echo "变更不涉及构建输入，跳过校验："
                printf '%s\n' "${changed}"
                exit 0
                ;;
            esac
            # CNB 在国内，PR 校验也走 DaoCloud 镜像。
            DOCKER_BUILDKIT=1 docker build --platform linux/amd64 --pull \
              --build-arg GITHUB_MIRROR=https://files.m.daocloud.io \
              --build-arg NODE_MIRROR=https://files.m.daocloud.io \
              -f .cnb/docker/Dockerfile.golang -t golang:pr . || exit 1
            # golang 镜像：Go 版本、工具链、fnpack 必须不存在
            docker run --rm golang:pr sh -eu -c '
              go version | grep -q "^go version go[0-9]"
              for b in go node npm pnpm git curl make jq upx nfpm sqlc golangci-lint \
                govulncheck shfmt dockerfmt yamlfmt gojq sql-formatter markdownfmt; do
                command -v "$b" >/dev/null 2>&1
              done
              ! command -v fnpack >/dev/null 2>&1
              printf "SMOKE_OK"
            ' | grep -q 'SMOKE_OK' || exit 1
