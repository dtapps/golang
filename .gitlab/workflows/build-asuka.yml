# 构建并推送 golang + asuka 变体镜像
# 由根 .gitlab-ci.yml 的 include 引入；workflow / stages / variables / default 都在根文件里。
# 基础镜像 ${CI_REGISTRY_IMAGE}:<go 版本> 必须已经由 build-golang 作业推好；
# 脚本会最多等 5 分钟，仍然不存在就报错退出。
build-asuka:
  resource_group: build-asuka
  stage: variants
  timeout: 120m
  script:
    - |
      set -eu
      export version="${VERSION:-}"
      # 留空 = 脚本解析上游最新稳定 tag；装不上（模块下载失败 / 编译失败）时
      # 自动降一个 patch 版本重试，只降一次。
      export asuka_version="${ASUKA_VERSION:-}"
      . ./.gitlab/scripts/build-asuka.sh
  artifacts:
    when: always
    expire_in: 30 days
    paths:
      - .gitlab/annotation-asuka.json
  rules:
    - if: '$TARGET == "" || $TARGET == "asuka"'
