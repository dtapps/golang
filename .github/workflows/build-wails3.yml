# ===================================================================
# GitHub Actions：构建并推送 wails3 镜像到 GHCR
#
#   产物：ghcr.io/<owner>/<repo>/wails3  → golang + GTK4/WebKitGTK + wails3 CLI
#
#   基础镜像由 build-golang.yml 产出。本工作流独立定时触发（比 build-fnpack
#   再晚 3 小时）或手动触发，都要求 <go 版本> 标签已经存在。
#
#   实现：GitHub 侧独立维护一份（与 CNB 各自维护，不共用）
#         · Dockerfile  .github/docker/Dockerfile.wails3
#         · 构建脚本    .github/scripts/build-wails3.sh
#         · 对照实现    .cnb/docker/Dockerfile.wails3 + .cnb/scripts/build-wails3.sh
#
#   版本：wails3 默认跟随上游最新稳定版（Dockerfile 的 WAILS3_VERSION=latest，
#         脚本构建前解析成具体 tag 再传进 build-arg，层缓存才跟得上版本）。
#         手动触发可以填 wails3_version 钉住（如 v3.0.0 / v3.0.0-beta.34）。
# ===================================================================
name: build-wails3

on:
  schedule:
    # 每天 22:35 UTC（北京 06:35），比 build-fnpack 的 19:35 UTC 晚 3 小时，
    # 给基础镜像留出构建时间。
    - cron: '35 22 * * *'
  workflow_dispatch:
    inputs:
      version:
        # 与 build-golang 的输入等价，用来选中对应的基础镜像标签
        description: '选填：Go 版本。留空 = 跟随 Dockerfile 的 GO_VERSION（golang:1-trixie，最新稳定 Go）；也可填 1.27 / 1.27.3'
        required: false
        default: ''
        type: string
      wails3_version:
        description: '选填：wails3 版本。留空 = 解析上游最新稳定 tag（如 v3.1.0）；也可填 v3.0.0 / 3.1.0 / v3.0.0-beta.34'
        required: false
        default: ''
        type: string

# GITHUB_TOKEN 默认只读，推送 GHCR 必须显式要 packages: write
permissions:
  contents: read
  packages: write

concurrency:
  group: build-wails3-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    # go install 要按 amd64 + arm64 各编译一遍 wails3 CLI，arm64 那趟走 QEMU，
    # 比 fnpack（只下载二进制）慢得多。
    timeout-minutes: 120
    steps:
      - name: 检出源码
        uses: actions/checkout@v4

      - name: 释放磁盘空间
        # GTK4 / WebKitGTK 开发包不小，加上两平台构建缓存与 Go 编译缓存，
        # 会吃掉 hosted runner 的临时盘。预装 SDK 与本构建无关。
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /

      - name: 安装 QEMU（跨架构构建 arm64）
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - name: 初始化 buildx
        uses: docker/setup-buildx-action@v3

      - name: 构建并推送多架构镜像
        id: build
        # 镜像名、revision、source 等由脚本从 Actions 内置变量派生；
        # 基础镜像标签由脚本从 Dockerfile 的 GO_VERSION 解析后拼接。
        env:
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          version: ${{ inputs.version }}
          wails3_version: ${{ inputs.wails3_version }}
        # 必须 source：脚本里的 export、trap 与退出码都留在当前 shell
        run: |
          source .github/scripts/build-wails3.sh

      - name: 写入运行摘要
        if: always()
        run: |
          {
            echo '### Golang + wails3 镜像（GHCR）'
            echo ''
            if [ -f .github/annotation-wails3.json ]; then
              echo '| 键 | 值 |'
              echo '| --- | --- |'
              jq -r 'to_entries[] | "| \(.key) | \(.value) |"' .github/annotation-wails3.json
            else
              echo '本次没有产出 .github/annotation-wails3.json（构建在元数据步骤之前就失败）。'
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: 上传构建元数据
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wails3-annotation
          path: .github/annotation-wails3.json
          if-no-files-found: warn
          retention-days: 30
