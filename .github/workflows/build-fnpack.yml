# ===================================================================
# GitHub Actions：构建并推送 fnpack 镜像到 GHCR
#
#   产物：ghcr.io/<owner>/<repo>/fnpack  → golang + fnpack
#
#   基础镜像由 build-golang.yml 产出。本工作流通过 workflow_run 接在它后面：
#   build-golang 在 main 上成功后自动构建 fnpack；也支持手动触发，或改动
#   fnpack 相关文件时单独跑——这两种情况要求 <go 版本> 标签已经存在。
#
#   实现：GitHub 侧独立维护一份（有意复制，不与 CNB 共用）
#         · Dockerfile  .github/docker/Dockerfile.fnpack
#         · 构建脚本    .github/scripts/build-fnpack.sh
#         · 对照实现    .cnb/docker/Dockerfile.fnpack + .cnb/scripts/build-fnpack.sh
#
#   镜像源：fnpack 从 https://static2.fnnas.com 下载，不经过 GitHub Release，
#           因此不使用 https://files.m.daocloud.io。
# ===================================================================
name: build-fnpack

on:
  # 基础镜像构建成功后自动接着跑（只认 main 分支上的运行）
  workflow_run:
    workflows:
      - build-golang
    types:
      - completed
    branches:
      - main
  workflow_dispatch:
    inputs:
      version:
        # 与 build-golang 的输入等价，用来选中对应的基础镜像标签
        description: '选填：Go 版本。留空 = 跟随 Dockerfile 的 GO_VERSION；也可填 1.27 / 1.27.3'
        required: false
        default: ''
        type: string
  push:
    branches:
      - main
    paths:
      - '.github/docker/Dockerfile.fnpack'
      - '.github/scripts/build-fnpack.sh'
      - '.github/workflows/build-fnpack.yml'
  pull_request:
    paths:
      - '.github/docker/Dockerfile.fnpack'
      - '.github/scripts/build-fnpack.sh'
      - '.github/workflows/build-fnpack.yml'

# GITHUB_TOKEN 默认只读，推送 GHCR 必须显式要 packages: write
permissions:
  contents: read
  packages: write

concurrency:
  group: build-fnpack-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    # PR 走下面的 validate-fnpack；workflow_run 只在 build-golang 成功时继续
    if: >
      github.event_name != 'pull_request' && (github.event_name != 'workflow_run' ||
       (github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.event != 'pull_request'))
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: 检出源码
        uses: actions/checkout@v4
        with:
          # workflow_run 时用触发那次 build-golang 的 commit，保证两边同源
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}

      - name: 释放磁盘空间
        # fnpack 层很薄，但 arm64 仿真与基础镜像拉取仍占用临时盘。
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /

      - name: 安装 QEMU（跨架构构建 arm64）
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - name: 初始化 buildx
        uses: docker/setup-buildx-action@v4

      - name: 构建并推送多架构镜像
        id: build
        # 镜像名、revision、source 等由脚本从 Actions 内置变量派生；
        # 基础镜像标签由脚本从 Dockerfile 的 GO_VERSION 解析后拼接。
        env:
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          version: ${{ inputs.version }}
        # 必须 source：脚本里的 export、trap 与退出码都留在当前 shell
        run: |
          source .github/scripts/build-fnpack.sh

      - name: 写入运行摘要
        if: always()
        run: |
          {
            echo '### Golang + fnpack 镜像（GHCR）'
            echo ''
            if [ -f .github/annotation-fnpack.json ]; then
              echo '| 键 | 值 |'
              echo '| --- | --- |'
              jq -r 'to_entries[] | "| \(.key) | \(.value) |"' .github/annotation-fnpack.json
            else
              echo '本次没有产出 .github/annotation-fnpack.json（构建在元数据步骤之前就失败）。'
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: 上传构建元数据
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fnpack-annotation
          path: .github/annotation-fnpack.json
          if-no-files-found: warn
          retention-days: 30

  validate-fnpack:
    # PR 校验：不推送、不登录。先构建 base 再构建 fnpack，证明继承链可用。
    # 刻意不初始化 buildx：fnpack 镜像 FROM 本地刚构建的 golang:pr，
    # docker-container builder 看不到宿主 Docker 镜像库，会去 registry 拉取而失败。
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: 检出源码
        uses: actions/checkout@v4

      - name: 构建 golang 基础镜像（不推送）
        run: |
          set -eu
          DOCKER_BUILDKIT=1 docker build --platform linux/amd64 --pull \
            -f .github/docker/Dockerfile.golang -t golang:pr .

      - name: 构建 fnpack 镜像（不推送）
        run: |
          set -eu
          DOCKER_BUILDKIT=1 docker build --platform linux/amd64 \
            --build-arg GOLANG_IMAGE=golang:pr \
            -f .github/docker/Dockerfile.fnpack -t golang-fnpack:pr .

      - name: 冒烟测试
        # 与 build-fnpack.sh 的断言同源：fnpack 存在且可执行，工具链继承成功
        run: |
          set -eu
          docker run --rm golang-fnpack:pr sh -eu -c '
            go version | grep -q "^go version go[0-9]"
            command -v fnpack >/dev/null 2>&1
            test -x /usr/local/bin/fnpack
            for b in go node pnpm sqlc golangci-lint; do
              command -v "$b" >/dev/null 2>&1
            done
            printf "SMOKE_OK"
          '
