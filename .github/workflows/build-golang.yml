# ===================================================================
# GitHub Actions：构建并推送 golang 基础镜像到 GHCR
#
#   产物：ghcr.io/<owner>/<repo>  → golang（不含 fnpack）
#
#   fnpack 镜像是另一个地址（ghcr.io/<owner>/<repo>/fnpack），由
#   build-fnpack.yml 单独构建：它 FROM 本工作流推好的 <go 版本> 标签。
#
#   实现：GitHub 侧独立维护一份（与 CNB 各自维护，不共用）
#         · Dockerfile  .github/docker/Dockerfile.golang
#         · 构建脚本    .github/scripts/build-golang.sh
#         · 对照实现    .cnb/docker/Dockerfile.golang + .cnb/scripts/build-golang.sh
#
#   触发：schedule（每天跟上游）/ workflow_dispatch
#
#   镜像源：Go / APT / npm / GitHub Release / nodejs.org 全走官方默认；CNB 侧才用国内镜像。
#
#   标签契约与 CNB 完全一致（<go 版本> / <major.minor> / latest /
#   <版本>-linux-{amd64,arm64}），详见 docs/github.md 与
#   docs/golang/images-and-tags.md。
# ===================================================================
# https://github.com/actions/runner-images
# https://github.com/actions/checkout
# https://github.com/docker/setup-qemu-action
# https://github.com/docker/setup-buildx-action
# https://github.com/actions/upload-artifact
name: build-golang

on:
  schedule:
    # 每天 00:05（Asia/Shanghai）= 16:05 UTC，与 CNB 的 crontab '5 0 * * *' 同刻。
    # GitHub 的 cron 只按 UTC 解析。
    - cron: '5 16 * * *'
  workflow_dispatch:
    inputs:
      version:
        # 与 CNB 按钮的 version 输入等价，白名单校验在脚本里
        description: '选填：Go 版本。留空 = 跟随 Dockerfile 的 GO_VERSION（golang:1-trixie，最新稳定 Go）；也可填 1.27 / 1.27.3'
        required: false
        default: ''
        type: string

# contents: read   actions/checkout 检出源码。
# packages: write  推镜像、写 buildcache 缓存清单、imagetools create 派生/提升标签；
#                  write 含 read，fnpack / wails3 还要读基座 manifest。
# 显式声明后未列出的权限一律不授予；降成 read 会在推送阶段被拒。
permissions:
  contents: read
  packages: write

# 并发策略：同一分支的多次触发串行排队，绝不取消「正在运行」的旧运行。
# cancel-in-progress: false 表示新运行进入 pending 等待，而非抢占/取消 in-progress。
# queue: max 让同一 group 最多保留 100 个 pending（默认 queue: single 只留 1 个，
# 新的会顶掉旧的 pending），按进入等待的先后 FIFO 依次执行，仅队列满的溢出运行被取消。
# 注意：queue: max 不能与 cancel-in-progress: true 组合，否则 workflow 校验失败。
concurrency:
  group: build-golang-${{ github.ref }}
  cancel-in-progress: false
  queue: max

jobs:
  build:
    runs-on: ubuntu-26.04
    timeout-minutes: 180
    steps:
      - name: 检出源码
        uses: actions/checkout@v7

      - name: 释放磁盘空间
        # runner 临时盘约 14 GiB：删掉无关的预装 SDK，避免构建期 no space left on device。
        # 并发删除预装 SDK：串行会把四个目录的 unlink 耗时相加，这里只等最慢的一个。
        run: |
          sudo rm -rf /usr/share/dotnet & p1=$!
          sudo rm -rf /usr/local/lib/android & p2=$!
          sudo rm -rf /opt/ghc & p3=$!
          sudo rm -rf /opt/hostedtoolcache/CodeQL & p4=$!
          rc=0
          for pid in "$p1" "$p2" "$p3" "$p4"; do
            wait "$pid" || rc=1
          done
          [ "$rc" -eq 0 ] || exit 1
          df -h /

      - name: 安装 QEMU（跨架构构建 arm64）
        # arm64 那层 go install / npm install 在 amd64 runner 上靠 binfmt/QEMU 执行；
        # 没有这一步 buildx 会在 arm64 阶段报 exec format error。
        uses: docker/setup-qemu-action@v4
        with:
          platforms: arm64

      - name: 初始化 buildx
        uses: docker/setup-buildx-action@v4

      - name: 构建并推送多架构镜像
        id: build
        # 镜像名、revision、source 等由脚本从 Actions 内置变量派生：
        #   IMAGE         ← ghcr.io + GITHUB_REPOSITORY（小写）
        #   REGISTRY_USER ← GITHUB_ACTOR
        #   REVISION      ← GITHUB_SHA
        #   IMAGE_SOURCE  ← https://github.com/<GITHUB_REPOSITORY>
        env:
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          version: ${{ inputs.version }}
        # 必须 source：脚本里的 export、trap 与退出码都留在当前 shell
        run: |
          source .github/scripts/build-golang.sh

      - name: 写入运行摘要
        if: always()
        run: |
          {
            echo '### Golang 镜像（GHCR）'
            echo ''
            if [ -f .github/annotation.json ]; then
              echo '| 键 | 值 |'
              echo '| --- | --- |'
              jq -r 'to_entries[] | "| \(.key) | \(.value) |"' .github/annotation.json
            else
              echo '本次没有产出 .github/annotation.json（构建在元数据步骤之前就失败）。'
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: 上传构建元数据
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: golang-annotation
          path: .github/annotation.json
          if-no-files-found: warn
          retention-days: 30
