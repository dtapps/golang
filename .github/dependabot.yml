version: 2

updates:
  # GitHub Actions 依赖（扫描 .github/workflows 下的第三方 action 版本）
  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'daily'
    labels:
      - 'dependencies'
      - 'github-actions'

  # Docker 基础镜像依赖（分别扫描三侧 Dockerfile 的 FROM / ARG 镜像标签）
  - package-ecosystem: 'docker'
    directory: '/.github/docker'
    schedule:
      interval: 'daily'
    labels:
      - 'dependencies'
      - 'docker'

  - package-ecosystem: 'docker'
    directory: '/.cnb/docker'
    schedule:
      interval: 'daily'
    labels:
      - 'dependencies'
      - 'docker'

  - package-ecosystem: 'docker'
    directory: '/.gitlab/docker'
    schedule:
      interval: 'daily'
    labels:
      - 'dependencies'
      - 'docker'
