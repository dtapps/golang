# 示例：Fyne —— 两个步骤：准备环境 → 使用
# 本仓库自测时把 uses 改成 ./；Linux 需自备 OpenGL / X11 / Wayland 系统库
name: build-fyne

on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  build:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      # 1) 准备环境：装 fyne CLI 并导出 PATH（不需要 Docker）
      - name: 准备环境
        uses: dtapps/golang@main
        with:
          framework: fyne
          setup-only: true

      # 2) 使用：CLI 已在 PATH 里
      - name: 构建并打包
        run: |
          go build -o bin/app ./cmd/app
          fyne package
