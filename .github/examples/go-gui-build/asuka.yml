# 示例：asuka —— 两个步骤：准备环境 → 使用
# 本仓库自测时把 uses 改成 ./；Linux 需自备 GTK4 / libadwaita 系统库
# asuka 没有 version 子命令，版本用 go version -m 读取
name: build-asuka

on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  build:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      # 1) 准备环境：检查 Go + 安装 asuka CLI（Linux 镜像里已自带，这里也只装 CLI）
      - name: 准备环境
        uses: dtapps/golang@main
        with:
          framework: asuka
          setup-only: true

      # 2) 使用：Linux 走 GTK4，macOS 平台名是 mac（不是 darwin）
      - name: 构建
        run: asuka build --platform ${{ runner.os == 'macOS' && 'mac' || (runner.os == 'Windows' && 'windows' || 'linux')
          }}
