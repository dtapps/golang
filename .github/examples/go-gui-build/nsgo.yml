# 示例：nsgo —— 两个步骤：准备环境 → 使用
# 本仓库自测时把 uses 改成 ./；Linux 需自备 GTK4 / WebKitGTK 6.0 / GStreamer 系统库
# nsgo 上游无 tag，@latest 会解析成伪版本，要复现请钉 NSGO_CLI_PIN
name: build-nsgo

on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  build:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      # 1) 准备环境：检查 Go + 安装 nsgo CLI
      - name: 准备环境
        uses: dtapps/golang@main
        with:
          framework: nsgo
          setup-only: true

      # 2) 使用：Linux 后端纯 Go、运行期 dlopen，编译不需要 build tag
      - name: 构建
        run: go build -o bin/app .
